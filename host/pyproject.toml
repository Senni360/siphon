[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "siphon-host"
version = "0.1.0"
description = "Siphon Chromium native messaging audio downloader"
requires-python = ">=3.13"
dependencies = ["yt-dlp[default]>=2026.3.17", "mutagen>=1.47"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
siphon-host = "siphon_host.__main__:main"

[tool.setuptools.packages.find]
include = ["siphon_host*"]

[tool.setuptools.package-data]
siphon_host = ["fonts/*.ttf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Install with: pip install --group host/pyproject.toml:analysis
[dependency-groups]
analysis = ["numpy>=2.2", "scipy>=1.15"]
