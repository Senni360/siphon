[workspace]
resolver = "2"
members = ["crates/siphon-analysis", "crates/siphon-host", "crates/siphon-tray"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
realfft = "3.5"
lofty = "0.25"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
