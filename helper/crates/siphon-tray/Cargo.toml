[package]
name = "siphon-tray"
description = "Siphon's floating drag-out tray for finished downloads"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"

[dev-dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Threading",
  "Win32_UI_HiDpi", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security",
  "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Diagnostics_Debug",
]
